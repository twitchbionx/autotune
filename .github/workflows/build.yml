name: Build Windows EXE

# Runs on every push to main and on tag pushes (for releases).
# Produces autotune.exe as a CI artifact, and attaches it to GitHub releases
# when triggered by a tag push (e.g. `git tag v0.1.0 && git push --tags`).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.*

      - name: Sanity-check package imports
        run: python -c "import autotune; print(autotune.__version__)"

      - name: Build autotune.exe
        run: python -m PyInstaller --noconfirm autotune.spec

      - name: Smoke test the built exe
        # --help doesn't need admin, so it's safe to run in CI
        run: |
          dist\autotune.exe --help
          dist\autotune.exe run --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autotune-windows-x64
          path: |
            dist/autotune.exe
            autotune/config.example.yaml
            autotune/README.md
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/autotune.exe
            autotune/config.example.yaml
